apiVersion: apps/v1
kind: Deployment
metadata:
  name: express-rag-backend
  namespace: s-harsh
  labels:
    app: express-rag-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: express-rag-backend
  template:
    metadata:
      labels:
        app: express-rag-backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/greenhacker420/expreess-assignment:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: express-rag-config
            - secretRef:
                name: express-rag-secret
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1024Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
