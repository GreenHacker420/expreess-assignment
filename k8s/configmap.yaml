apiVersion: v1
kind: ConfigMap
metadata:
  name: express-rag-config
  namespace: s-harsh
  labels:
    app: express-rag-backend
data:
  LLM_PROVIDER: "gemini"
  GEMINI_MODEL: "gemini-3.8-flash"
  GEMINI_FAST_MODEL: "gemini-3.8-flash"
  EMBEDDING_PROVIDER: "gemini"
  GEMINI_EMBEDDING_MODEL: "gemini-embedding-2"
  CHROMA_DIR: "backend/data/chroma"
  CHROMA_COLLECTION: "fastapi_docs_gemini2_qa_v1"
  DB_PATH: "backend/data/app.db"
  CHECKPOINT_DB_PATH: "backend/data/checkpoints.db"
  MAX_RETRIES: "2"
  TOP_K: "5"
  WEB_SEARCH_ENABLED: "true"
  WEB_SEARCH_PROVIDER: "gemini"
  LANGSMITH_TRACING: "false"
