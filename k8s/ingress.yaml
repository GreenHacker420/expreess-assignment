apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: express-rag-ingress
  namespace: s-harsh
  labels:
    app: express-rag-backend
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  rules:
    - host: express-rag.nstsdc.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: express-rag-backend
                port:
                  number: 8000
