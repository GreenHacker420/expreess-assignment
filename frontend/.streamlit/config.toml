# Ocean Azure & Warm Cream theme
# Palette:
# #086288 (rgb(8, 98, 136))   - Deep Oceanic Blue
# #4D8DBA (rgb(77, 141, 186))  - Steel Azure
# #97D7FF (rgb(151, 215, 255)) - Soft Sky Blue
# #FFEFC4 (rgb(255, 239, 196)) - Warm Cream
# #FFFFFF - White

[theme]
base = "light"

# --- Core colors ---
primaryColor             = "#086288"
backgroundColor          = "#F5F9FC"
secondaryBackgroundColor = "#EBF5FB"
textColor                = "#0E2A38"

# --- Semantic colors ---
borderColor              = "#97D7FF"
linkColor                = "#086288"
codeBackgroundColor      = "#E8F4FA"
codeTextColor            = "#086288"

# --- Typography ---
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@600;700&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
linkUnderline = false

# --- Shape ---
baseRadius   = "0.75rem"
buttonRadius = "full"
showWidgetBorder  = true
showSidebarBorder = true

# --- Spacing ---
paddingTop    = "1rem"
paddingBottom = "2rem"

# --- Sidebar ---
[theme.sidebar]
backgroundColor          = "#EBF5FB"
secondaryBackgroundColor = "#D8ECF8"
textColor                = "#0E2A38"
borderColor              = "#97D7FF"
primaryColor             = "#086288"
linkColor                = "#086288"
showWidgetBorder         = true
